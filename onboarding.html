<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monumenta — Cadastro e Onboarding (Protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ==========================================================================
     Linguagem visual inspirada no design system da Apple (minimalista, clara,
     muito espaço em branco, hierarquia tipográfica forte, cantos contínuos,
     profundidade sutil via blur/sombra em vez de bordas pesadas) — mantendo a
     identidade Monumenta (fundo escuro, verde-limão de destaque). Tipografia
     usa a pilha de fontes de sistema (San Francisco em dispositivos Apple),
     com Inter como equivalente em outras plataformas; pronta para receber
     Monoblock/Ragman oficiais quando chegarem.
     ========================================================================== */
  :root{
    /* Preto e branco "Apple": nunca extremos puros — preto levemente aquecido
       (é literalmente o #111111 da Monumenta) e branco levemente acinzentado
       (#F5F5F7, o "White" usado pela própria Apple em vez de #FFFFFF puro). */
    --off-black:#111111;
    --off-white:#F5F5F7;
    --bg:var(--off-black);
    --surface:#1C1C1E;       /* superfície elevada — mesmo tom do dark mode da Apple */
    --surface-2:#232326;     /* superfície secundária */
    --surface-3:#323234;     /* superfície terciária (inputs sobre cards) */
    --accent:#C8F135;
    --accent-dim: rgba(200,241,53,0.16);
    --text:var(--off-white);
    --text-secondary:rgba(245,245,247,0.58);
    --text-tertiary:rgba(245,245,247,0.36);
    --border: rgba(245,245,247,0.09);
    --border-accent: rgba(200,241,53,0.5);
    --danger:#FF6B6B;
    --font-head: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
    --radius-sm: 12px;
    --radius: 20px;
    --radius-lg: 26px;
    --ease: cubic-bezier(.25,.8,.25,1);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  h1,h2,h3,h4{ font-family:var(--font-head); margin:0; letter-spacing:-0.02em; font-weight:700; color:var(--text); }
  a{ color:var(--accent); text-decoration:none; }
  button{ font-family:var(--font-body); cursor:pointer; }
  @keyframes fadeInUp{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }

  #banner{
    position:sticky; top:0; z-index:50;
    background:rgba(17,17,17,.72); backdrop-filter:blur(20px) saturate(1.6); -webkit-backdrop-filter:blur(20px) saturate(1.6);
    border-bottom:1px solid var(--border); padding:10px 24px;
    font-size:12.5px; color:var(--text-secondary); display:flex; justify-content:space-between; align-items:center; gap:16px;
  }
  #banner .tag{ color:var(--accent); font-weight:600; }
  #banner select, #banner button{
    background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:980px;
    padding:6px 14px; font-size:12px; font-weight:500; transition:background .15s var(--ease);
  }
  #banner button:hover{ background:var(--surface-3); }
  #app{ min-height:calc(100vh - 46px); }
  .container{ max-width:1080px; margin:0 auto; padding:48px 24px 90px; animation:fadeInUp .45s var(--ease) both; }
  .container.narrow{ max-width:680px; }

  /* ---------- shared ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border-radius:var(--radius-sm); border:1px solid transparent; padding:13px 22px;
    font-size:15px; font-weight:600; letter-spacing:-0.01em; transition:transform .12s var(--ease), background .15s var(--ease), opacity .15s var(--ease);
    white-space:nowrap;
  }
  .btn:active{ transform:scale(.96); }
  .btn-primary{ background:var(--accent); color:var(--off-black); }
  .btn-primary:hover{ filter:brightness(1.07); }
  .btn-primary:disabled{ opacity:.35; cursor:not-allowed; transform:none; }
  .btn-secondary{ background:var(--surface-2); color:var(--text); border-color:var(--border); }
  .btn-secondary:hover{ background:var(--surface-3); }
  .btn-ghost{ background:transparent; color:var(--text-secondary); border:none; }
  .btn-ghost:hover{ color:var(--text); }
  .btn-sm{ padding:8px 14px; font-size:13px; border-radius:980px; }
  .btn-danger-outline{ background:rgba(255,107,107,.08); border:1px solid rgba(255,107,107,.35); color:var(--danger); }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:28px; box-shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 40px rgba(0,0,0,.28);
  }
  .grid{ display:grid; gap:18px; }
  .grid-2{ grid-template-columns:1fr 1fr; }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  @media(max-width:800px){ .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr; } }

  label{ display:block; font-size:13px; color:var(--text-secondary); margin-bottom:7px; font-weight:500; }
  label .req{ color:var(--accent); }
  input[type=text], input[type=email], input[type=tel], input[type=date], input[type=time],
  input[type=number], input[type=file], select, textarea{
    width:100%; background:var(--surface-2); border:1px solid transparent; color:var(--text);
    border-radius:var(--radius-sm); padding:13px 14px; font-size:15px; font-family:var(--font-body);
    transition:border-color .15s var(--ease), background .15s var(--ease);
  }
  input::placeholder, textarea::placeholder{ color:var(--text-tertiary); }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--accent); background:var(--surface-3); box-shadow:0 0 0 4px var(--accent-dim); }
  textarea{ resize:vertical; min-height:88px; line-height:1.5; }
  .field{ margin-bottom:18px; }
  .hint{ font-size:12.5px; color:var(--text-secondary); margin-top:7px; line-height:1.55; }
  .hint-err{ color:#e5484d; }
  .readonly-chip{
    display:inline-flex; align-items:center; justify-content:space-between; gap:8px; background:var(--surface-2);
    border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; font-size:14.5px; width:100%;
  }
  .readonly-chip .lock{ color:var(--text-tertiary); font-size:11.5px; }

  .badge{ display:inline-block; padding:4px 11px; border-radius:980px; font-size:11.5px; font-weight:600; letter-spacing:-0.01em; }
  .badge-lime{ background:var(--accent-dim); color:var(--accent); }
  .badge-grey{ background:rgba(245,245,247,.08); color:var(--text-secondary); }
  .badge-warn{ background:rgba(255,190,60,.14); color:#ffbe3c; }
  .badge-danger{ background:rgba(255,107,107,.14); color:var(--danger); }

  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ text-align:left; color:var(--text-tertiary); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; padding:12px 16px; border-bottom:1px solid var(--border); }
  td{ padding:16px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tr:hover td{ background:rgba(245,245,247,.025); }

  .divider{ height:1px; background:var(--border); margin:26px 0; border:none; }
  .section-title{ font-size:28px; margin-bottom:6px; letter-spacing:-0.02em; }
  .section-sub{ color:var(--text-secondary); font-size:15px; margin-bottom:28px; line-height:1.5; }

  /* ---------- Segmented control (estilo Apple) ---------- */
  .segmented{ display:inline-flex; background:var(--surface-2); border-radius:980px; padding:3px; gap:2px; }
  .segmented button{
    border:none; background:transparent; color:var(--text-secondary); font-size:13px; font-weight:600;
    padding:7px 16px; border-radius:980px; transition:all .18s var(--ease);
  }
  .segmented button.active{ background:var(--surface-3); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.4); }

  /* ---------- RH nav ---------- */
  .rh-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:32px; gap:16px; flex-wrap:wrap; }
  .metrics{ display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:32px; }
  @media(max-width:900px){ .metrics{ grid-template-columns:repeat(3,1fr);} }
  .metric{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:18px;
    transition:transform .18s var(--ease), background .18s var(--ease);
  }
  .metric:hover{ transform:translateY(-2px); background:var(--surface-2); }
  .metric .num{ font-family:var(--font-head); font-size:30px; font-weight:700; letter-spacing:-0.02em; }
  .metric .lbl{ font-size:12.5px; color:var(--text-secondary); margin-top:3px; }
  .filters{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center; }
  .filters input, .filters select{ width:auto; min-width:160px; }

  /* ---------- Portal ---------- */
  .progress-wrap{ margin-bottom:32px; }
  .progress-bar-bg{ height:4px; background:var(--surface-2); border-radius:980px; overflow:hidden; }
  .progress-bar-fill{ height:100%; background:var(--accent); transition:width .45s var(--ease); border-radius:980px; }
  .progress-label{ font-size:12.5px; color:var(--text-secondary); margin-top:10px; display:flex; justify-content:space-between; font-weight:500; }
  .step-actions{ display:flex; justify-content:space-between; margin-top:32px; gap:12px; }
  .onboarding-card{
    border:1px solid var(--border-accent); background:linear-gradient(160deg, rgba(200,241,53,.08), rgba(200,241,53,.015));
    backdrop-filter:blur(6px); border-radius:var(--radius); padding:26px; margin-bottom:26px;
  }
  .onboarding-card h3{ font-size:13px; color:var(--accent); letter-spacing:.02em; margin-bottom:14px; font-weight:700; }
  .onboarding-row{ font-size:15.5px; margin-bottom:5px; }
  .onboarding-btns{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .welcome-hero{ margin-bottom:36px; }
  .welcome-hero .eyebrow{ color:var(--accent); font-size:13px; font-weight:600; letter-spacing:.02em; margin-bottom:12px; }
  .welcome-hero h1{ font-size:38px; margin-bottom:16px; line-height:1.08; }
  .welcome-hero p{ color:var(--text-secondary); font-size:16px; line-height:1.65; max-width:600px; }
  .info-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:22px 0; }
  @media(max-width:700px){ .info-grid{ grid-template-columns:1fr 1fr; } }
  .info-item .k{ font-size:11.5px; color:var(--text-tertiary); letter-spacing:.03em; font-weight:500; }
  .info-item .v{ font-size:15.5px; margin-top:4px; font-weight:500; }
  .doc-row{ display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid var(--border); gap:16px; }
  .doc-row:last-child{ border-bottom:none; }
  .doc-row .name{ font-size:14.5px; }
  .doc-row .name .opt{ color:var(--text-secondary); font-weight:400; font-size:12px; }
  .review-block{ margin-bottom:24px; }
  .review-block h4{ font-size:12.5px; color:var(--accent); letter-spacing:.03em; margin-bottom:11px; display:flex; justify-content:space-between; align-items:center; font-weight:700; }
  .review-kv{ display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; font-size:14px; }
  .review-kv div span{ display:block; color:var(--text-tertiary); font-size:11.5px; margin-bottom:1px; }
  .toast{
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(6px); background:rgba(28,28,30,.85);
    backdrop-filter:blur(20px) saturate(1.8); -webkit-backdrop-filter:blur(20px) saturate(1.8);
    color:var(--text); border:1px solid var(--border); padding:14px 24px; border-radius:980px; font-size:14px; font-weight:600;
    box-shadow:0 12px 40px rgba(0,0,0,.5); z-index:999; opacity:0; transition:opacity .3s var(--ease), transform .3s var(--ease);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .dep-card{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:18px; margin-bottom:14px; position:relative; background:var(--surface-2); }
  .benef-item{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:18px; margin-bottom:12px; display:flex; gap:14px; align-items:flex-start; background:var(--surface-2); }
  .benef-item input[type=checkbox]{ width:19px; height:19px; margin-top:2px; accent-color:var(--accent); }
  .checklist-item{ display:flex; gap:10px; align-items:flex-start; font-size:13.5px; color:var(--text-secondary); margin-bottom:6px; }
  .link-box{ display:flex; gap:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; align-items:center; }
  .link-box code{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; color:var(--accent); }
  .empty-state{ text-align:center; padding:64px 20px; color:var(--text-secondary); }
  .kbd-note{ font-size:11.5px; color:var(--text-tertiary); margin-top:44px; text-align:center; }

  /* ==========================================================================
     "Construção estilo apple.com/macbook-pro": página de boas-vindas do
     colaborador remodelada como uma página de produto — seção cheia (full-bleed)
     por seção, nav local que aparece ao rolar, títulos enormes, estatística
     isolada em destaque, grade de recursos, revelação suave ao rolar (scroll
     reveal) e uma barra de CTA fixa no rodapé.
     ========================================================================== */
  .reveal{ opacity:0; transform:translateY(28px); transition:opacity .7s var(--ease), transform .7s var(--ease); }
  .reveal.is-visible{ opacity:1; transform:translateY(0); }

  .local-nav{
    position:sticky; top:0; z-index:45; display:flex; justify-content:center; gap:6px; padding:12px 20px;
    background:rgba(17,17,17,.7); backdrop-filter:blur(20px) saturate(1.6); -webkit-backdrop-filter:blur(20px) saturate(1.6);
    border-bottom:1px solid transparent; opacity:0; transform:translateY(-10px); pointer-events:none;
    transition:opacity .3s var(--ease), transform .3s var(--ease), border-color .3s var(--ease); flex-wrap:wrap;
  }
  .local-nav.show{ opacity:1; transform:translateY(0); pointer-events:auto; border-bottom-color:var(--border); }
  .local-nav a{ font-size:13px; color:var(--text-secondary); padding:7px 15px; border-radius:980px; font-weight:500; transition:background .15s var(--ease), color .15s var(--ease); }
  .local-nav a:hover{ color:var(--text); background:var(--surface-2); }

  .hero-section{ position:relative; text-align:center; padding:120px 24px 84px; overflow:hidden; }
  .hero-orb{
    position:absolute; top:-160px; left:50%; transform:translateX(-50%); width:640px; height:640px; border-radius:50%;
    background:radial-gradient(circle, var(--accent) 0%, transparent 68%); opacity:.16; filter:blur(10px); pointer-events:none;
  }
  .hero-section .eyebrow{ position:relative; display:block; text-align:center; }
  .hero-section h1{ position:relative; font-size:60px; line-height:1.03; letter-spacing:-0.03em; margin:0 auto 20px; max-width:820px; }
  @media(max-width:760px){ .hero-section h1{ font-size:38px; } .hero-orb{ width:420px; height:420px; } }
  .hero-section p.lead{ position:relative; max-width:560px; margin:0 auto 36px; text-align:center; }
  .hero-cta-row{ position:relative; display:flex; gap:22px; justify-content:center; align-items:center; flex-wrap:wrap; }
  .hero-cta-row .link-more{ font-size:15px; color:var(--accent); font-weight:600; }
  .hero-cta-row .link-more:hover{ text-decoration:underline; }

  .feature-section{ padding:88px 24px; }
  .feature-section.alt{ background:var(--surface); }
  .feature-section .kicker{ display:block; text-align:center; color:var(--accent); font-size:13px; font-weight:700; margin-bottom:10px; }
  .feature-section > .kicker, .feature-section > h2{ max-width:1080px; margin-left:auto; margin-right:auto; text-align:center; }
  .feature-section > h2{ font-size:34px; letter-spacing:-0.02em; margin-bottom:44px; }
  @media(max-width:760px){ .feature-section > h2{ font-size:26px; } }
  .feature-grid{ max-width:1080px; margin:0 auto; display:flex; gap:60px; align-items:center; flex-wrap:wrap; }
  .feature-grid.reverse{ flex-direction:row-reverse; }
  .feature-grid > div{ flex:1 1 340px; }
  .feature-grid h3{ font-size:24px; margin-bottom:14px; letter-spacing:-0.01em; }
  .feature-grid p{ color:var(--text-secondary); font-size:15.5px; line-height:1.65; margin:0 0 20px; }
  .feature-visual{ display:flex; align-items:center; justify-content:center; }

  .avatar-badge{
    width:200px; height:200px; border-radius:50%; background:radial-gradient(circle at 35% 30%, var(--accent-dim), var(--surface-2) 70%);
    border:1px solid var(--border-accent); display:flex; align-items:center; justify-content:center;
    font-size:58px; font-weight:800; color:var(--accent); letter-spacing:-0.02em;
  }
  .date-badge{ width:172px; padding:26px 20px; border-radius:var(--radius-lg); background:var(--surface-2); border:1px solid var(--border); text-align:center; }
  .date-badge .day{ font-size:58px; font-weight:800; line-height:1; color:var(--accent); letter-spacing:-0.03em; }
  .date-badge .month{ font-size:13px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.06em; margin-top:8px; }
  .date-badge .weekday{ font-size:12.5px; color:var(--text-tertiary); margin-top:2px; }

  .stat-band{ text-align:center; padding:104px 24px; }
  .stat-band .stat-num{ font-size:104px; font-weight:800; letter-spacing:-0.04em; color:var(--accent); line-height:1; }
  @media(max-width:760px){ .stat-band .stat-num{ font-size:58px; } }
  .stat-band .stat-cap{ font-size:17px; color:var(--text-secondary); margin-top:14px; max-width:440px; margin-left:auto; margin-right:auto; }
  .stat-row{ display:flex; justify-content:center; gap:52px; margin-top:48px; flex-wrap:wrap; }
  .stat-row .mini-stat .n{ font-size:26px; font-weight:700; color:var(--text); }
  .stat-row .mini-stat .l{ font-size:12.5px; color:var(--text-tertiary); margin-top:4px; }

  .tile-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; max-width:1080px; margin:0 auto; }
  @media(max-width:760px){ .tile-grid{ grid-template-columns:1fr 1fr; } }
  .tile{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px 18px; font-size:13.5px; display:flex; align-items:center; gap:10px; }
  .tile .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); flex-shrink:0; }

  .final-cta{ text-align:center; padding:110px 24px 130px; }
  .final-cta h2{ font-size:38px; letter-spacing:-0.02em; margin-bottom:16px; }
  @media(max-width:760px){ .final-cta h2{ font-size:28px; } }
  .final-cta p{ color:var(--text-secondary); font-size:16px; margin-bottom:32px; }

  .sticky-cta{
    position:fixed; left:0; right:0; bottom:0; z-index:60; background:rgba(17,17,17,.85);
    backdrop-filter:blur(20px) saturate(1.6); -webkit-backdrop-filter:blur(20px) saturate(1.6);
    border-top:1px solid var(--border); padding:14px 24px; display:flex; justify-content:center; gap:22px; align-items:center;
    transform:translateY(100%); transition:transform .35s var(--ease);
  }
  .sticky-cta.show{ transform:translateY(0); }
  .sticky-cta span{ font-size:14px; color:var(--text-secondary); }

  .footnotes{ max-width:680px; margin:0 auto; padding:28px 24px 60px; border-top:1px solid var(--border); font-size:11.5px; color:var(--text-tertiary); line-height:1.8; }
  sup.fn{ color:var(--accent); font-size:10px; margin-left:1px; }
</style>
</head>
<body>

<div id="banner">
  <div><span class="tag">MONUMENTA · Onboarding</span> — convites e cadastros ficam salvos na Base Central (GitHub); os 2 links "demo" abaixo continuam só de exemplo, sem gravar nada.</div>
  <div style="display:flex; gap:8px; align-items:center;">
    <span>Ver como:</span>
    <button onclick="location.hash='#/rh'">Painel RH</button>
    <button onclick="location.hash='#/portal/demo-clt-01'">Portal (CLT demo)</button>
    <button onclick="location.hash='#/portal/demo-pj-01'">Portal (PJ demo)</button>
    <button id="btnLogoutRH" style="display:none" onclick="logoutRH()">Sair do RH</button>
  </div>
</div>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* =========================================================================
   PERSISTÊNCIA REAL — Base Central (GitHub) + ponte segura (Cloudflare Worker)
   ========================================================================= */
const GH_OWNER = 'rafaelribeiropsi';
const GH_REPO_CADASTRO = 'monumentabaserh';
const GH_REPO_FINANCEIRO = 'monumentabaserh-financeiro';
const PATH_CONVITES = 'convites_onboarding.json';
const PATH_PROPOSTAS = 'propostas_onboarding.json';
// Ponte segura (Cloudflare Worker) — única credencial pública é esta URL,
// nenhum token do GitHub jamais fica no formulário do colaborador.
const ONBOARDING_BRIDGE_URL = 'https://round-night-39db.rribeiro.workers.dev';

// Só a visão do RH (#/rh/...) usa isto — o formulário público do colaborador
// (#/portal/...) NUNCA guarda nem usa este token, só fala com a ponte segura acima.
let RH_TOKEN = null;
let SHA_CONVITES = null;
let SHA_PROPOSTAS = null;
let RH_BOOT_ERRO = null;
let RH_BOOTED = false;

function rhHeaders(){
  return { Authorization:`Bearer ${RH_TOKEN}`, Accept:'application/vnd.github+json' };
}
function b64EncodeUtf8(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64DecodeUtf8(b64){ return decodeURIComponent(escape(atob(b64.replace(/\n/g,'')))); }

async function ghGetFile(repo, path){
  const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${repo}/contents/${path}`, { headers: rhHeaders() });
  if(res.status === 404) return { data: null, sha: null };
  if(!res.ok) throw new Error(`Falha ao ler ${path} (HTTP ${res.status}) — confira se o token tem acesso a ${repo}.`);
  const body = await res.json();
  return { data: JSON.parse(b64DecodeUtf8(body.content)), sha: body.sha };
}
async function ghPutFile(repo, path, dataObj, sha, message){
  const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${repo}/contents/${path}`, {
    method:'PUT', headers: rhHeaders(),
    body: JSON.stringify({ message, content: b64EncodeUtf8(JSON.stringify(dataObj,null,2)), sha: sha||undefined }),
  });
  if(!res.ok){ const t = await res.text(); throw new Error(`Falha ao gravar ${path} (HTTP ${res.status}): ${t}`); }
  return res.json();
}

// Carrega convites (Cadastro) + propostas já enviadas pelos colaboradores
// (Financeiro — só leitura, é onde ficam CPF/dados bancários) e junta tudo
// no formato que as telas de RH já sabem exibir (DB.cadastros).
async function rhBoot(){
  RH_BOOT_ERRO = null;
  try{
    const [convitesRes, propostasRes] = await Promise.all([
      ghGetFile(GH_REPO_CADASTRO, PATH_CONVITES),
      ghGetFile(GH_REPO_FINANCEIRO, PATH_PROPOSTAS),
    ]);
    SHA_CONVITES = convitesRes.sha;
    SHA_PROPOSTAS = propostasRes.sha;
    const convites = convitesRes.data?.convites || [];
    const propostas = propostasRes.data?.propostas || [];
    const porToken = {};
    propostas.forEach(p=>{ porToken[p.token] = p; });

    const reais = convites.map(c=>{
      const p = porToken[c.token];
      const base = { ...c };
      if(p){
        // funde o que o colaborador respondeu (guardado no Financeiro) com o convite
        Object.assign(base, p.dados || {});
        base.respostas = (p.dados && p.dados.respostas) || {};
        base.status = p.status === 'Aprovado' ? 'validado' : p.status === 'Rejeitado' ? 'correcao_solicitada' : 'em_conferencia';
        base.progresso = 90;
      }
      // "Concluído" é uma etapa administrativa à parte (o colaborador já foi
      // aprovado e ativado) — por isso fica num campo próprio no convite, em
      // vez de sobrescrever o status derivado da proposta acima.
      if(c.concluido) base.status = 'concluido';
      return base;
    });
    // Mantém os 2 cadastros de demonstração (não existem no GitHub) + os reais.
    DB.cadastros = [...DB.cadastros.filter(c=>c.token.startsWith('demo-')), ...reais];
    RH_BOOTED = true;
  }catch(e){
    RH_BOOT_ERRO = e.message;
    RH_BOOTED = false;
  }
}

// Upload real de documentos: lê o arquivo do próprio navegador do colaborador
// e converte para base64, que vai dentro do cadastro enviado à ponte segura
// (Worker) e fica salvo no Financeiro junto com o resto dos dados. Por isso
// o limite por arquivo é conservador — ver TAMANHO_MAXIMO_PAYLOAD no Worker.
const MAX_DOC_BYTES = 3 * 1024 * 1024; // 3 MB por arquivo
function lerArquivoComoBase64(file){
  return new Promise((resolve, reject)=>{
    if(!file) { reject(new Error('Nenhum arquivo selecionado.')); return; }
    if(file.size > MAX_DOC_BYTES){
      reject(new Error(`Arquivo muito grande (${(file.size/1024/1024).toFixed(1)} MB) — o limite é ${(MAX_DOC_BYTES/1024/1024).toFixed(0)} MB.`));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => resolve({ nomeArquivo:file.name, tipo:file.type||'application/octet-stream', tamanho:file.size, conteudoBase64: String(reader.result).split(',')[1] });
    reader.onerror = () => reject(new Error('Não consegui ler o arquivo. Tente novamente.'));
    reader.readAsDataURL(file);
  });
}

// Busca um convite público (sem login) na ponte segura, e injeta em DB.cadastros
// pra reaproveitar toda a lógica de tela já existente (findByToken etc.).
async function ensurePortalToken(token){
  if(findByToken(token)) return true;
  try{
    const resp = await fetch(`${ONBOARDING_BRIDGE_URL}?token=${encodeURIComponent(token)}`);
    const result = await resp.json().catch(()=>({ok:false}));
    if(!resp.ok || !result.ok || !result.convite) return false;
    const c = result.convite;
    DB.cadastros.push({
      id:'ext-'+token, token:c.token, modelo:c.modelo,
      nome:c.nome, nomePreferencial:c.nomePreferencial || (c.nome||'').split(' ')[0],
      cargo:c.cargo, senioridade:c.senioridade, area:c.area, equipe:c.equipe,
      gestor:c.gestor, diretor:c.diretor, dataInicio:c.dataInicio,
      status:c.status||'convite_enviado', progresso:10,
      motivoRejeicao: c.motivoRejeicao || null, aceitesPoliticas: c.aceitesPoliticas || [],
      onboarding:{}, beneficiosDefinidos:{}, respostas:{}, solicitacoesCorrecao:[], documentos:{},
    });
    return true;
  }catch(e){ return false; }
}

/* Efeitos de rolagem (estilo apple.com): revelação suave dos blocos ao entrar
   na tela, nav local que aparece após o herói, e barra de CTA fixa. Falha de
   forma segura em ambientes sem IntersectionObserver (ex.: testes headless). */
function setupScrollEffects(){
  const reveals = document.querySelectorAll('.reveal:not(.is-visible)');
  if(window.IntersectionObserver){
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){ entry.target.classList.add('is-visible'); io.unobserve(entry.target); }
      });
    }, { threshold:0.12 });
    reveals.forEach(el=>io.observe(el));
  } else {
    reveals.forEach(el=>el.classList.add('is-visible'));
  }

  const localNav = document.getElementById('localNav');
  const heroSection = document.querySelector('.hero-section');
  if(localNav && heroSection){
    const onScrollNav = ()=>{
      const bottom = heroSection.getBoundingClientRect().bottom;
      localNav.classList.toggle('show', bottom < 56);
    };
    window.addEventListener('scroll', onScrollNav);
    onScrollNav();
  }

  const stickyCta = document.getElementById('stickyCta');
  if(stickyCta){
    const onScrollCta = ()=>{ stickyCta.classList.toggle('show', window.scrollY > 420); };
    window.addEventListener('scroll', onScrollCta);
    onScrollCta();
  }
}

      statusConfirmacao:'aguardando', versao:1 },
    beneficiosDefinidos,
    respostas:{}, solicitacoesCorrecao:[], documentos:{},
  };

  btn.disabled = true; btn.textContent = 'Gravando...'; msg.textContent = ''; msg.className = 'msg';
  try{
    const { data, sha } = await ghGetFile(GH_REPO_CADASTRO, PATH_CONVITES);
    const arquivo = data || { gerado_em: new Date().toISOString().slice(0,10),
      aviso: 'Convites de onboarding gerados pelo RH — só dados não sensíveis (nome, cargo, área, gestor). Respostas do colaborador (CPF, dados bancários) ficam no repositório Financeiro.',

    msg.className = 'msg err';
    btn.disabled = false; btn.textContent = 'Gerar link individual';
  }
  return false;
}

/* ---- Aprovação/rejeição real (grava no GitHub) ---- */
async function aprovarCadastro(id){
  const c = findById(id);
  if(ehCadastroDemo(c)){ setStatus(id,'validado'); return; }
  await gravarDecisaoProposta(id, 'validado', 'Aprovado', null);
}
async function solicitarCorrecaoRH(id){
  const c = findById(id);
  const motivo = prompt('O que precisa ser corrigido? (o colaborador vai ver essa mensagem no portal dele)');
  if(!motivo) return;
  if(ehCadastroDemo(c)){ setStatus(id,'correcao_solicitada'); return; }
  await gravarDecisaoProposta(id, 'correcao_solicitada', 'Rejeitado', motivo);
}
// Sempre relê os dois arquivos na hora de gravar (em vez de reusar o SHA
// guardado no boot), para não sobrescrever uma alteração feita em paralelo
// por outra pessoa do RH nesse meio-tempo.
async function gravarDecisaoProposta(id, statusConvite, decisaoProposta, motivo){
  const c = findById(id);
  const msg = document.getElementById('msgAcaoConferencia');
  if(msg){ msg.textContent = 'Gravando...'; msg.className = 'hint'; }
  try{
    const { data, sha } = await ghGetFile(GH_REPO_FINANCEIRO, PATH_PROPOSTAS);
    const arquivo = data || { propostas: [] };
    const p = (arquivo.propostas||[]).find(x=>x.token===c.token);
    if(!p) throw new Error('Este colaborador ainda não enviou o cadastro — não há proposta para decidir.');
    p.status = decisaoProposta;
    p.decidido_em = new Date().toISOString();
    if(motivo) p.motivo_decisao = motivo; else delete p.motivo_decisao;
    await ghPutFile(GH_REPO_FINANCEIRO, PATH_PROPOSTAS, arquivo, sha, `Onboarding: ${decisaoProposta} — ${c.nome}`);

    const { data: dadosConvites, sha: shaConvites } = await ghGetFile(GH_REPO_CADASTRO, PATH_CONVITES);
    const conviteArquivo = dadosConvites || { convites: [] };
    const convite = (conviteArquivo.convites||[]).find(x=>x.token===c.token);
    if(convite){
      convite.status = statusConvite;
      if(motivo) convite.motivoRejeicao = motivo; else delete convite.motivoRejeicao;
      await ghPutFile(GH_REPO_CADASTRO, PATH_CONVITES, conviteArquivo, shaConvites, `Onboarding: status ${statusConvite} — ${c.nome}`);
    }
    c.status = statusConvite;
    if(motivo) c.motivoRejeicao = motivo; else delete c.motivoRejeicao;
    if(msg) msg.textContent = '';
    render(); showToast('Status atualizado: ' + (STATUS_LABELS[statusConvite]||statusConvite));
  }catch(e){
    if(msg){ msg.textContent = 'Não consegui gravar (' + e.message + ').'; msg.className = 'hint hint-err'; }
  }
}
async function concluirCadastro(id){
  const c = findById(id);
  if(ehCadastroDemo(c)){ setStatus(id,'concluido'); return; }
  const msg = document.getElementById('msgAcaoConferencia');
  if(msg){ msg.textContent = 'Gravando...'; msg.className = 'hint'; }
  try{
    const { data, sha } = await ghGetFile(GH_REPO_CADASTRO, PATH_CONVITES);
    const arquivo = data || { convites: [] };
    const convite = (arquivo.convites||[]).find(x=>x.token===c.token);
    if(!convite) throw new Error('Convite não encontrado.');
    convite.concluido = true;
    convite.concluido_em = new Date().toISOString();
    await ghPutFile(GH_REPO_CADASTRO, PATH_CONVITES, arquivo, sha, `Onboarding: concluído — ${c.nome}`);
    c.status = 'concluido';
    if(msg) msg.textContent = '';
    render(); showToast('Marcado como concluído');

function reagendarOnboarding(id){
  const c = findById(id);
  c.onboarding.versao += 1; c.onboarding.statusConfirmacao = 'aguardando';
  render(); showToast('Onboarding reagendado — nova versão criada, colaborador será notificado (simulado)');
}
function salvarBeneficios(ev, id){
  ev.preventDefault();
  const c = findById(id);
  const beneficiosDefinidos = {};
  BENEFICIOS_CATALOGO.filter(b=>!b.sempre).forEach(b=>{ beneficiosDefinidos[b.id] = ev.target.querySelector(`[name=benef_${b.id}]`)?.checked || false; });
  c.beneficiosDefinidos = beneficiosDefinidos;
  render(); showToast('Benefícios atualizados — o colaborador já vê a lista nova no portal');
  return false;
}

function abrirCorrecao(id){
  const texto = prompt('Descreva o que está incorreto (será enviado ao RH):');

function stepsFor(modelo){
  return modelo==='PJ'
    ? ['Dados pessoais','Um pouco mais sobre você','Dados da pessoa jurídica','Representante legal','Benefícios','Dados bancários e pagamento','Documentos','Termos e declarações']
    : ['Dados pessoais','Um pouco mais sobre você','Dados admissionais','Dependentes','Benefícios','Dados bancários','Documentos','Termos e declarações'];
}

function wizardShell(c, stepIndex, bodyHtml, opts={}){
  const steps = stepsFor(c.modelo);
  const total = steps.length;
  const pct = Math.round(((stepIndex)/(total))*100);
  return `
  <div class="container narrow">
    <div class="progress-wrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%;"></div></div>
      <div class="progress-label"><span>Etapa ${stepIndex+1} de ${total}</span><span>${steps[stepIndex]}</span></div>
    </div>
    <div class="card">
      <h2 style="margin-bottom:18px;">${steps[stepIndex]}</h2>
      <form id="wizardForm" onsubmit="return goNext(event,'${c.token}',${stepIndex})">
        ${bodyHtml}
        <div class="step-actions">
          ${stepIndex>0
            ? `<button type="button" class="btn btn-secondary" onclick="location.hash='#/portal/${c.token}/step/${stepIndex-1}'">Voltar</button>`
            : `<button type="button" class="btn btn-secondary" onclick="location.hash='#/portal/${c.token}'">Voltar ao início</button>`}
          <button type="submit" class="btn btn-primary" ${opts.disablePrimary?'disabled':''}>${stepIndex===total-1?'Ir para revisão':'Próximo'}</button>
        </div>
      </form>
    </div>
  </div>`;
}

async function marcarDoc(id, nomeDoc, inputEl){
  const c = findById(id); c.documentos = c.documentos||{};

  const msg = document.getElementById('msgUploadDocs');
  try{

    if(msg){ msg.textContent = ''; msg.className = 'hint'; }

function baixarDocumento(id, nomeDoc){
  const c = findById(id);
  const doc = (c.documentos||{})[nomeDoc];
  if(!doc || !doc.conteudoBase64){ showToast('Documento não disponível para download.'); return; }
  const link = document.createElement('a');
  link.href = `data:${doc.tipo||'application/octet-stream'};base64,${doc.conteudoBase64}`;
  link.download = doc.nomeArquivo || nomeDoc;
  document.body.appendChild(link); link.click(); link.remove();
}

function goNext(ev, token, stepIndex){
  ev.preventDefault();
  const c = findByToken(token);
  const form = ev.target;
  const data = {};
  new FormData(form).forEach((v,k)=>{ if(!k.startsWith('benef_') && !k.startsWith('doc_')) data[k]=v; });
  c.respostas = c.respostas || {};

  if(stepIndex===1){
    c.respostas.sobreVoce = {...(c.respostas.sobreVoce||{}), ...data};
  } else if(stepIndex===4){
    // Benefícios: os uploads são registrados direto pelo onchange (marcarBeneficioDoc); nada a coletar aqui.
  } else if(c.modelo==='PJ'){
    if(stepIndex===0) c.respostas.dadosPessoais = {...(c.respostas.dadosPessoais||{}), ...data};
    if(stepIndex===2) c.respostas.dadosPJ = {...(c.respostas.dadosPJ||{}), ...data};
    if(stepIndex===3) c.respostas.representanteLegal = {...(c.respostas.representanteLegal||{}), ...data};
    if(stepIndex===5) c.respostas.bancarioPJ = {...(c.respostas.bancarioPJ||{}), ...data};
    if(stepIndex===7) c.respostas.termos = { aceitou:true, dataAceite:new Date().toLocaleDateString('pt-BR') };
  } else {
    if(stepIndex===0) c.respostas.dadosPessoais = {...(c.respostas.dadosPessoais||{}), ...data};
    if(stepIndex===2) c.respostas.dadosAdmissionais = {...(c.respostas.dadosAdmissionais||{}), ...data};
    if(stepIndex===5) c.respostas.bancarioCLT = {...(c.respostas.bancarioCLT||{}), ...data};
    if(stepIndex===7) c.respostas.termos = { aceitou:true, dataAceite:new Date().toLocaleDateString('pt-BR') };
  }

  const total = stepsFor(c.modelo).length;
  c.status = 'em_preenchimento';
  c.progresso = Math.min(95, Math.round(((stepIndex+1)/total)*100));

  if(stepIndex+1 < total) location.hash = `#/portal/${token}/step/${stepIndex+1}`;
  else location.hash = `#/portal/${token}/revisao`;
  return false;
}

async function enviarCadastro(token){
  const c = findByToken(token);
  const btn = document.getElementById('btnEnviarCadastro');
  const msg = document.getElementById('msgEnvioCadastro');
  if(btn){ btn.disabled = true; btn.textContent = 'Enviando...'; }
  if(msg){ msg.textContent = ''; msg.className = 'hint'; }
  try{
    const resp = await fetch(ONBOARDING_BRIDGE_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        token: c.token,
        modelo: c.modelo,
        nome: c.nome,
        nomePreferencial: c.nomePreferencial,
        emailPessoal: c.emailPessoal,
        telefone: c.telefone,
        cargo: c.cargo, senioridade: c.senioridade, area: c.area, equipe: c.equipe,
        gestor: c.gestor, diretor: c.diretor, clienteProjeto: c.clienteProjeto, centroCusto: c.centroCusto,
        dataInicio: c.dataInicio,
        respostas: c.respostas || {},
        documentos: c.documentos || {},
      }),
    });
    const result = await resp.json().catch(()=>({ok:false, error:'Resposta inesperada do servidor.'}));
    if(!resp.ok || !result.ok){
      throw new Error(result.error || `Erro ao enviar (HTTP ${resp.status})`);
    }
    c.status = 'enviado'; c.progresso = 100;
    location.hash = `#/portal/${token}/concluido`;
  }catch(e){
    if(msg){
      msg.textContent = 'Não foi possível enviar seu cadastro agora (' + e.message + '). Tente novamente em instantes — se persistir, avise o RH.';
      msg.className = 'hint hint-err';
    }
    if(btn){ btn.disabled = false; btn.textContent = 'Enviar cadastro'; }
  }
}

  if(!c) return `<div class="container narrow"><div class="empty-state">Link inválido.</div></div>`;
  c.aceitesPoliticas = c.aceitesPoliticas || [];
  const linhas = POLITICAS_CATALOGO.map(p=>{
    const aceite = c.aceitesPoliticas.find(a=>a.politicaId===p.id && a.versao===p.versao);
    const url = POLITICAS_BASE_URL + p.arquivo;
    return `
    <div class="card" style="margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;">
        <div>
          <div style="font-weight:600;">${p.titulo}</div>
          <div class="hint">${aceite ? 'Aceito em ' + new Date(aceite.aceito_em).toLocaleDateString('pt-BR') : 'Ainda não aceito'}</div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <a class="btn btn-secondary btn-sm" href="${url}" target="_blank" rel="noopener">Ler</a>
          <a class="btn btn-secondary btn-sm" href="${url}" download>Baixar</a>
          ${aceite ? '' : `<button class="btn btn-primary btn-sm" onclick="aceitarPolitica('${c.token}','${p.id}','${p.versao}', this)">Confirmar leitura e aceite</button>`}
        </div>
      </div>
    </div>`;
  }).join('');
  return `
  <div class="container narrow">
    <button class="btn btn-ghost btn-sm" onclick="location.hash='#/portal/${token}'">← Voltar</button>
    <h1 class="section-title" style="margin-top:14px;">Políticas da Monumenta</h1>
    <div class="section-sub">Leia, baixe e confirme a ciência das políticas internas. Você pode voltar aqui quando quiser.</div>
    ${linhas}
    <div class="hint" id="msgPoliticas"></div>
  </div>`;
}
async function aceitarPolitica(token, politicaId, versao, btnEl){
  const msg = document.getElementById('msgPoliticas');
  if(btnEl){ btnEl.disabled = true; btnEl.textContent = 'Confirmando...'; }
  try{
    const resp = await fetch(ONBOARDING_BRIDGE_URL, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ acao:'aceite_politica', token, politicaId, versao }),
    });
    const result = await resp.json().catch(()=>({ok:false}));
    if(!resp.ok || !result.ok) throw new Error(result.error || `Erro (HTTP ${resp.status})`);
    const c = findByToken(token);
    if(c) c.aceitesPoliticas = result.aceitesPoliticas || c.aceitesPoliticas;
    document.getElementById('app').innerHTML = viewPortalPoliticas(token);
    showToast('Aceite registrado');
  }catch(e){
    if(btnEl){ btnEl.disabled = false; btnEl.textContent = 'Confirmar leitura e aceite'; }
    if(msg){ msg.textContent = 'Não consegui registrar o aceite (' + e.message + ').'; msg.className = 'hint hint-err'; }
  }
}
</script>
